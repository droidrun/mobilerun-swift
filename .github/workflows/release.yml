name: SwiftPM release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Release tags must point to a commit on main.'
            exit 1
          fi
      - name: Verify semantic version and changelog
        run: tool/release-notes.py "$GITHUB_REF_NAME"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    environment: release
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit and notes
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Release tags must point to a commit on main.'
            exit 1
          fi
          tool/release-notes.py "$GITHUB_REF_NAME" > release-notes.txt
      # The token is available only to the final release step.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
