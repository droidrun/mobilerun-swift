name: Swift
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Check generated constants
        run: |
          python3 tool/generate-constants.py
          git diff --exit-code
      - run: swift build
      - run: swift test
      - name: Build iOS simulator library
        run: xcodebuild -scheme MobilerunStream -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
