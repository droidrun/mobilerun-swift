name: Swift
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift --version
      - name: Check generated constants
        run: |
          python3 tool/generate-constants.py
          git diff --exit-code
      - run: swift build
      - run: swift build -c release
      - run: swift test
      - name: Check public API baseline
        run: tool/api-dump.sh --check
      - name: Upload API check diagnostic
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-api
          path: .build/api-current.txt
          if-no-files-found: ignore
      - name: Release dry run
        run: tool/release-notes.py --latest > /dev/null
      - name: Build iOS simulator library
        run: xcodebuild -scheme MobilerunStream -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Build Release iOS simulator library
        run: xcodebuild -scheme MobilerunStream -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Build tester app
        run: >-
          xcodebuild -project Examples/Connection/Connection.xcodeproj
          -scheme Connection -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Test UIKit input on simulator
        run: >-
          xcodebuild -scheme MobilerunStream
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -parallel-testing-enabled NO -only-testing:MobilerunConformanceTests
          -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO
      - name: Test default UI on simulator
        run: >-
          xcodebuild -project Examples/Connection/Connection.xcodeproj
          -scheme Connection -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -parallel-testing-enabled NO -only-testing:InputUITests/DefaultUITests ONLY_ACTIVE_ARCH=YES
          -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO
      - name: Test sample app
        run: >-
          xcodebuild -project Examples/Connection/Connection.xcodeproj
          -scheme Connection -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -parallel-testing-enabled NO -only-testing:SampleTests -only-testing:InputUITests/SampleUITests
          ONLY_ACTIVE_ARCH=YES -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO
      - name: Test approval adaptive layout
        run: >-
          xcodebuild -project Examples/Connection/Connection.xcodeproj
          -scheme Connection -configuration Debug
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=latest'
          -parallel-testing-enabled NO -only-testing:InputUITests/DefaultUITests/testApprovalAdaptiveWidth
          -only-testing:InputUITests/DefaultUITests/testApprovalCardWidthBreakpoint
          ONLY_ACTIVE_ARCH=YES -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO
