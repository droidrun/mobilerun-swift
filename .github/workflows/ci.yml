name: Swift
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Check generated constants
        run: |
          python3 tool/generate-constants.py
          git diff --exit-code
      - run: swift build
      - run: swift test
      - name: Build iOS simulator library
        run: xcodebuild -scheme MobilerunStream -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Build connection example
        run: >-
          xcodebuild -project Examples/Connection/Connection.xcodeproj
          -scheme Connection -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Test UIKit input on simulator
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS")))')
          device=$(xcrun simctl create 'Input Tests' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          trap 'xcrun simctl shutdown "$device" || true; xcrun simctl delete "$device"' EXIT
          xcodebuild -scheme MobilerunStream-Package -destination "id=$device" \
            -parallel-testing-enabled NO -only-testing:MobilerunConformanceTests/NativeInputTests \
            -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO
